<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 2 - Validação Progressiva Completa</title>
    <link rel="stylesheet" href="exemplo2.css">
</head>
<body>
    <div class="container">
        <h1>Validação Progressiva</h1>
        <p>Feedback em tempo real durante o preenchimento</p>
        
        <form id="form-progressivo">
            <div class="form-group">
                <label for="nome">Nome de usuário:</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="nome" 
                        name="nome"
                        placeholder="mínimo 3 caracteres"
                    >
                    <span class="icone-validacao"></span>
                </div>
                <span class="mensagem-erro" id="erro-nome"></span>
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="email" 
                        name="email"
                        placeholder="seu@email.com"
                    >
                    <span class="icone-validacao"></span>
                </div>
                <span class="mensagem-erro" id="erro-email"></span>
            </div>

            <div class="form-group">
                <label for="cpf">CPF:</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="cpf" 
                        name="cpf"
                        placeholder="000.000.000-00"
                        maxlength="14"
                    >
                    <span class="icone-validacao"></span>
                </div>
                <span class="mensagem-erro" id="erro-cpf"></span>
            </div>

            <div class="form-group">
                <label for="senha">Senha:</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="senha" 
                        name="senha"
                        placeholder="mínimo 8 caracteres"
                    >
                    <span class="icone-validacao"></span>
                </div>
                <span class="mensagem-erro" id="erro-senha"></span>
                <ul class="requisitos-senha">
                    <li id="req-tamanho">Mínimo 8 caracteres</li>
                    <li id="req-letra">Pelo menos uma letra</li>
                    <li id="req-numero">Pelo menos um número</li>
                </ul>
            </div>

            <button type="submit">Enviar Formulário</button>
        </form>
    </div>

    <script src="exemplo2.js"></script>
</body>
</html>
